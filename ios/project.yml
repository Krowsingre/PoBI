name: PoBI
options:
  bundleIdPrefix: com.krowsingre
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PoBI:
    type: application
    platform: iOS
    sources:
      - path: PoBI
    scheme: {}
    info:
      path: PoBI/Info.plist
      properties:
        CFBundleDisplayName: Plate or Break It
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Plate or Break It uses your location to show nearby places and confirm you're at a restaurant when you rate or check in.
        NSCameraUsageDescription: Take a photo of your dish and your receipt.
        # Lets a receipt PDF, saved email or screenshot be shared into the app (digital receipts).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Receipt
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image, public.email-message, com.apple.mail.email, public.html, public.plain-text]
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: PoBI/PoBI.entitlements
      properties:
        # Sign in with Apple. The archive is built unsigned, so CI signs these in before export.
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krowsingre.pobi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

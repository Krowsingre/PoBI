name: iOS

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for simulator
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set +e
          xcodebuild -project PoBI.xcodeproj -scheme PoBI \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          # Compiler errors scroll far above the end of the log, so print them first.
          grep -E "error:|warning: .*PoBI/" build.log | sort -u | head -n 60
          tail -n 40 build.log
          exit $status

  testflight:
    name: Upload to TestFlight
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RAW_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      RAW_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      RAW_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      RAW_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean up secret values
        # Pasted secrets often carry a trailing space or newline, which breaks team and key lookups.
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          for name in TEAM_ID KEY_ID ISSUER_ID; do
            raw_var="RAW_$name"
            value=$(trim "${!raw_var}")
            if [ -z "$value" ]; then echo "::error::Secret for $name is empty"; exit 1; fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Show Xcode version
        # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26) or later.
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write game server address
        # The address and public (anon) key are meant to ship inside the app; the database's
        # row-level security is what protects the data. Without this file the app stays offline.
        run: |
          ref=$(printf '%s' "$RAW_SUPABASE_URL" | tr -d '[:space:]' | grep -oE '[a-z]{20}' | head -n 1 || true)
          key=$(printf '%s' "$RAW_SUPABASE_ANON_KEY" | tr -d '[:space:]')
          if [ -z "$ref" ] || [ -z "$key" ]; then echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is missing"; exit 1; fi
          jq -n --arg url "https://$ref.supabase.co" --arg key "$key" '{url: $url, anonKey: $key}' > PoBI/Resources/server.json
      - name: Generate project
        run: xcodegen generate
      - name: Write App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Archive
        # Archived without signing. Signing on a fresh runner made Xcode create a new
        # development certificate every run, until Apple's certificate limit was hit.
        # The export step below signs the app for the App Store with cloud signing instead.
        run: |
          set -o pipefail
          xcodebuild -project PoBI.xcodeproj -scheme PoBI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PoBI.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 80
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PoBI.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 80

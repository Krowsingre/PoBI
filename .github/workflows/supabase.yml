name: Game server

on:
  pull_request:
    paths: ["supabase/**", "server/**", "data/load_places.py", ".github/workflows/supabase.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", "server/**", "data/load_places.py", "ios/PoBI/Resources/nj_places.tsv", ".github/workflows/supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test migrations on a local Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run the checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/rules.sql
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test the App Attest function
        run: deno test --allow-env supabase/functions/attest/handler.test.ts

  deploy:
    name: Apply to Supabase
    needs: test
    runs-on: ubuntu-latest
    env:
      RAW_URL: ${{ secrets.SUPABASE_URL }}
      RAW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # A fixed version: "latest" asks the GitHub API, which is rate limited on shared runners.
          version: 3.2.0
      - name: Link the project
        run: |
          url=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          # The project ref is the 20-letter id in https://<ref>.supabase.co, wherever it sits in the value.
          ref=$(printf '%s' "$url" | grep -oE '[a-z]{20}' | head -n 1 || true)
          if [ -z "$ref" ]; then
            echo "::error::SUPABASE_URL should look like https://<20-letter project id>.supabase.co (value has ${#url} characters, no 20-letter id found)"
            exit 1
          fi
          echo "::add-mask::$ref"
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "SUPABASE_ACCESS_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=$(printf '%s' "$RAW_DB_PASSWORD" | tr -d '\r\n')" >> "$GITHUB_ENV"
      - name: Preview (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --dry-run
      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --yes
      - name: Deploy the App Attest function
        if: github.event_name != 'pull_request'
        run: |
          team=$(printf '%s' "$RAW_TEAM_ID" | tr -d '[:space:]')
          if [ -z "$team" ]; then echo "::error::APPLE_TEAM_ID secret is empty"; exit 1; fi
          supabase secrets set --project-ref "$PROJECT_REF" --yes "APPLE_TEAM_ID=$team"
          supabase functions deploy attest --project-ref "$PROJECT_REF" --use-api --yes
      - name: Turn on guest sign-in
        # Players start as anonymous (guest) accounts, so the app needs no sign-up screen yet.
        run: |
          curl -sS --fail-with-body -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"external_anonymous_users_enabled": true}' > /dev/null
          on=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.external_anonymous_users_enabled')
          if [ "$on" != "true" ]; then echo "::error::Guest sign-in is still off (got $on)"; exit 1; fi
          echo "Guest sign-in is on."

  places:
    name: Load the place catalogue
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RAW_URL: ${{ secrets.SUPABASE_URL }}
      RAW_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install h3==4.5.1
      - name: Upload places with their areas
        run: |
          ref=$(printf '%s' "$RAW_URL" | tr -d '[:space:]' | grep -oE '[a-z]{20}' | head -n 1)
          python data/load_places.py "https://$ref.supabase.co" "$(printf '%s' "$RAW_SERVICE" | tr -d '[:space:]')"

  smoke:
    name: Try the live server like the app does
    needs: [deploy, places]
    # Only after migrations are applied (main), since it checks the new schema on the live server.
    if: always() && github.event_name != 'pull_request' && needs.deploy.result == 'success' && needs.places.result != 'failure'
    runs-on: ubuntu-latest
    env:
      RAW_URL: ${{ secrets.SUPABASE_URL }}
      RAW_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
      RAW_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Guest sign-in, rate, check in, then delete the test player
        run: |
          ref=$(printf '%s' "$RAW_URL" | tr -d '[:space:]' | grep -oE '[a-z]{20}' | head -n 1)
          base="https://$ref.supabase.co"
          anon=$(printf '%s' "$RAW_ANON" | tr -d '[:space:]')
          service=$(printf '%s' "$RAW_SERVICE" | tr -d '[:space:]')
          bash supabase/tests/smoke.sh "$base" "$anon" "$service"
